name: Build & deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sitemap lastmod comes from git history

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 3
          include-hidden-files: true # out/.well-known/

  # main → travedise.com, dev → dev.travedise.pages.dev.
  # The ref guard matters for workflow_dispatch, which can be run from any branch.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      # Wrangler bundles functions/ (Pages middleware) from the working directory.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      # Run Wrangler directly: wrangler-action would try to install via pnpm (lockfile present).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c875c02d0b617757f8c631be7664e6c5
        run: >-
          npx --yes wrangler@4 pages deploy out --project-name travedise
          --branch ${{ github.ref_name }} --commit-hash ${{ github.sha }}
